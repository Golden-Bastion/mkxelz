name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality and generator tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run generator tests
        run: cargo test -p mkxelz-core

      - name: Validate bundled specs
        run: |
          cargo run -p mkxelz-cli -- validate specs/dungeon.json
          cargo run -p mkxelz-cli -- validate specs/meadow.json
          cargo run -p mkxelz-cli -- validate preset:dungeon
          cargo run -p mkxelz-cli -- validate preset:meadow

      - name: Run Clippy on non-GUI crates
        run: cargo clippy -p mkxelz-core -p mkxelz-cli --all-targets -- -D warnings

  android:
    name: Build and sign Android arm64 APKs
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.2.12479018

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Prepare shared Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          source_keystore="$RUNNER_TEMP/source-signing.keystore"
          signing_keystore="$RUNNER_TEMP/mkxelz-signing.p12"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$source_keystore"
          chmod 600 "$source_keystore"

          # cargo-apk exposes the keystore path and store password, but not
          # separate alias/key-password options. Repackage the selected key as
          # a single-entry PKCS12 keystore using the store password for both.
          keytool -importkeystore -noprompt \
            -srckeystore "$source_keystore" \
            -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -srcalias "$ANDROID_KEY_ALIAS" \
            -srckeypass "$ANDROID_KEY_PASSWORD" \
            -destkeystore "$signing_keystore" \
            -deststoretype PKCS12 \
            -deststorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -destkeypass "$ANDROID_KEYSTORE_PASSWORD" \
            -destalias "$ANDROID_KEY_ALIAS"

          chmod 600 "$signing_keystore"
          rm -f "$source_keystore"
          keytool -list -keystore "$signing_keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo "CARGO_APK_DEV_KEYSTORE=$signing_keystore" >> "$GITHUB_ENV"
          echo "CARGO_APK_DEV_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE=$signing_keystore" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: crates/mkxelz-app
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: cargo apk build --lib

      - name: Build release APK
        working-directory: crates/mkxelz-app
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: cargo apk build --release --lib

      - name: Verify APK signatures and shared identity
        id: apks
        run: |
          set -euo pipefail
          debug_apk="$(find target/debug/apk -maxdepth 1 -type f -name '*.apk' -print -quit)"
          release_apk="$(find target/release/apk -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$debug_apk" ] || [ -z "$release_apk" ]; then
            echo "Expected both debug and release APKs, but one or both are missing" >&2
            find target -type f -name '*.apk' -print
            exit 1
          fi

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"

          "$apksigner" verify --verbose --print-certs "$debug_apk"
          "$apksigner" verify --verbose --print-certs "$release_apk"

          debug_cert="$("$apksigner" verify --print-certs "$debug_apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}')"
          release_cert="$("$apksigner" verify --print-certs "$release_apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}')"

          if [ -z "$debug_cert" ] || [ "$debug_cert" != "$release_cert" ]; then
            echo "Debug and release APKs do not have the same signing certificate" >&2
            exit 1
          fi

          echo "Debug and release APKs use the same signing certificate."
          echo "debug_path=$debug_apk" >> "$GITHUB_OUTPUT"
          echo "release_path=$release_apk" >> "$GITHUB_OUTPUT"

      - name: Upload Android APKs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mkxelz-android-arm64
          path: |
            ${{ steps.apks.outputs.debug_path }}
            ${{ steps.apks.outputs.release_path }}
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish Android APK release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: android
    permissions:
      contents: write
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v8.0.1
        with:
          name: mkxelz-android-arm64
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
