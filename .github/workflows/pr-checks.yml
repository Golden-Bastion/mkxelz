name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: Auto-format Rust
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_PUSH_TOKEN }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: false

      - name: Format source and push changes
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cargo fmt --all -v
          if git diff --quiet; then
            echo "Formatting is already clean."
            exit 0
          fi
          git config user.email "110196116+right-ward@users.noreply.github.com"
          git config user.name "right-ward"
          git add --all
          git commit -m "refactor: cargo-fmt"
          git push origin "HEAD:$HEAD_BRANCH"
