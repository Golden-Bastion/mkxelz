name: CI / Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality and generator tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run generator tests
        run: cargo test -p mkxelz-core

      - name: Validate bundled specs
        run: |
          cargo run -p mkxelz-cli -- validate specs/dungeon.json
          cargo run -p mkxelz-cli -- validate specs/meadow.json
          cargo run -p mkxelz-cli -- validate preset:dungeon
          cargo run -p mkxelz-cli -- validate preset:meadow

      - name: Run Clippy on non-GUI crates
        run: cargo clippy -p mkxelz-core -p mkxelz-cli --all-targets -- -D warnings

  android:
    name: Build Android arm64 APK
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.2.12479018

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Build release APK
        working-directory: crates/mkxelz-app
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: cargo apk build --release --lib

      - name: Locate APK
        id: apk
        run: |
          APK_PATH="$(find crates/mkxelz-app/target -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "cargo-apk completed but no APK was found" >&2
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Built APK: $APK_PATH"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mkxelz-android-arm64
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Android APK release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: android
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: mkxelz-android-arm64
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
