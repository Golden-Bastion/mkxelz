[package]
name = "mkxelz-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "egui GUI for mkxelz (Android first, desktop for development)"

[lib]
name = "mkxelz_app"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mkxelz-desktop"
path = "src/main.rs"

[dependencies]
mkxelz-core = { path = "../mkxelz-core" }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }

# Used by `cargo apk` (https://github.com/rust-mobile/cargo-apk)
[package.metadata.android]
package = "rightward.mkxelz.app"
apk_name = "MkXelz"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "MkXelz"
